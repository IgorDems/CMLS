name: Build and Publish CloudMart to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'source/backend/**'
      - 'source/frontend/**'
      - 'docker/backend/**'
      - 'docker/frontend/**'
      - '.github/workflows/cloudmart-ghcr.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend] # Збираємо обидва компоненти паралельно
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

#      - name: Run Terraform Validation
#        run: chmod +x scripts/check-environment.sh && ./scripts/check-environment.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudmart-${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Контекст збірки - це папка з кодом (туди Docker COPY . .)
          context: ./source/${{ matrix.component }}
          file: ./docker/${{ matrix.component }}/Dockerfile
          push: true
          tags: ghcr.io/igordems/cloudmart-${{ matrix.component }}:latest
          build-args: |
            VITE_API_BASE_URL=https://api.cloudmart.192.168.1.240.sslip.io/api
