name: CloudMart GitOps Workflow

on:
  push:
    branches: [ main ]
    paths:
      - 'kubernetes/base/**'   # Спрацьовує, якщо змінюються маніфести в base

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      # Тут виконуються ваші утиліти оновлення образів через Kustomize (наприклад)
      - name: Update Manifests
        run: |
          echo "Updating cloudmart kustomization files..."
          # Якщо тут є конкретні виклики kustomize edit set image, залиште їх тут

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          cd ${{ github.workspace }}

          for i in {1..5}; do
            echo "GitOps Sync Attempt $i..."
            git add .
            git commit -m "chore: auto-update cloudmart base images [skip ci]" || echo "no changes"
            if git pull --rebase origin main && git push origin main; then
              echo "GitOps successfully synchronized!"
              break
            fi
            echo "Push rejected, retrying in 5 seconds..."
            sleep 5
          done
