- name: Commit & push
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        # Захист циклом pull --rebase від конфліктів паралельного пушу
        for i in {1..5}; do
          echo "GitOps Sync Attempt $i..."
          
          # 1. Завжди додаємо та комітимо поточні зміни перед rebase
          git add .
          git commit -m "deploy: update cloudmart images to sha-${GITHUB_SHA::7}" || echo "No new changes to commit"
          
          # 2. Намагаємося стягнути зміни і запушити
          if git pull --rebase origin main && git push origin main; then
            echo "GitOps successfully synchronized!"
            break
          fi
          
          echo "Push rejected or conflict occurred. Retrying in 5 seconds..."
          sleep 5
        done
