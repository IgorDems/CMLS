name: agent-gateway-gitops

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/igordems/agent-gateway

jobs:
  build-and-update:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Diagnostics
      run: chmod +x scripts/check-environment.sh && ./scripts/check-environment.sh

    - name: Set tag
      run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_USERNAME }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build image
      run: |
        docker build \
          -t $IMAGE:$TAG \
          -f docker/agent-gateway/Dockerfile .

    - name: Push image
      run: |
        docker push $IMAGE:$TAG

    - name: Install kustomize
      uses: github-actions/setup-kustomize@v3
      with:
        kustomize-version: "5.4.2"

    - name: Update image tag in kustomization
      run: |
        cd kubernetes/overlays/lab
        kustomize edit set image ${IMAGE}=${IMAGE}:${TAG}

    - name: Commit & push
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        # Додаємо геть усі змінені файли, щоб Git не сварився на unstaged changes
        git add .
        git commit -m "chore: auto-update image tags [skip ci]" || echo "no changes"

        # Безпечний цикл push з rebase
        for i in {1..5}; do
          git pull --rebase origin main && git push origin main && break
          echo "Push rejected, retrying in 5 seconds..."
          sleep 5
        done
