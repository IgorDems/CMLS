name: Deploy CloudMart

on:
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Встановлюємо Kustomize правильно (Рішення помилки tar)
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      # Логіка оновлення образу (приклад для бекенду)
      - name: Update Backend Image
        run: |
          cd kubernetes/base/cloudmart-backend
          kustomize edit set image ghcr.io/igordems/cloudmart-backend=ghcr.io/igordems/cloudmart-backend:${{ github.sha }}

      # Логіка оновлення образу (приклад для фронтенду)
      - name: Update Frontend Image
        run: |
          cd kubernetes/base/cloudmart-frontend
          kustomize edit set image ghcr.io/igordems/cloudmart-frontend=${{ github.sha }}

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 1. Додаємо АБСОЛЮТНО ВСІ змінені маніфести (базові та оверлеї)
          git add .

          # 2. Створюємо коміт із міткою [skip ci] та підставляємо правильну змінну github.sha
          git commit -m "chore: auto-update cloudmart images to ${{ github.sha }} [skip ci]" || echo "no changes"

          # 3. Захищений цикл підтягування свіжих змін та push
          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && break
            echo "Push rejected, retrying in 5 seconds..."
            sleep 5
          done
