apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  labels:
    app: localstack

data:
  10-bootstrap.sh: |
    #!/bin/bash

    set +e

    export AWS_DEFAULT_REGION=us-east-1

    echo "🚀 LocalStack bootstrap started..."

    ENDPOINT=http://localhost:4566

    aws --endpoint-url=$ENDPOINT dynamodb create-table \
      --table-name cloudmart_products \
      --attribute-definitions \
        AttributeName=pk,AttributeType=S \
        AttributeName=sk,AttributeType=S \
      --key-schema \
        AttributeName=pk,KeyType=HASH \
        AttributeName=sk,KeyType=RANGE \
      --billing-mode PAY_PER_REQUEST 2>/dev/null

    aws --endpoint-url=$ENDPOINT dynamodb create-table \
      --table-name cloudmart_orders \
      --attribute-definitions \
        AttributeName=pk,AttributeType=S \
        AttributeName=sk,AttributeType=S \
      --key-schema \
        AttributeName=pk,KeyType=HASH \
        AttributeName=sk,KeyType=RANGE \
      --billing-mode PAY_PER_REQUEST 2>/dev/null

    aws --endpoint-url=$ENDPOINT sqs create-queue \
      --queue-name cloudmart-orders 2>/dev/null

    aws --endpoint-url=$ENDPOINT dynamodb put-item \
      --table-name cloudmart_products \
      --item '{
        "pk": {"S": "PRODUCT#1"},
        "sk": {"S": "META"},
        "name": {"S": "CloudMart T-Shirt"},
        "price": {"N": "25"}
      }' 2>/dev/null

    echo "✅ LocalStack bootstrap completed"
