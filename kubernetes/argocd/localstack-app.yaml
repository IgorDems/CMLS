apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmls-localstack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IgorDems/CMLS.git'
    targetRevision: main
    path: kubernetes/base/localstack
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
