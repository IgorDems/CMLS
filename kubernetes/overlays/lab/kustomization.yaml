apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#- ../../base/localstack
resources:
- ../../base/namespace
- ../../base/ollama
- ../../base/ai-stack
- ../../base/agent-gateway
- ../../base/monitoring
- ../../base/cloudmart-backend
- ../../base/cloudmart-frontend
- ../../base/order-processor

images:
- name: cloudmart-backend
  newName: ghcr.io/igordems/cloudmart-backend
  newTag: latest
- name: cloudmart-frontend
  newName: ghcr.io/igordems/cloudmart-frontend
  newTag: latest
- name: ghcr.io/igordems/agent-gateway
  newName: ghcr.io/igordems/agent-gateway
  newTag: f8634db8ce362fb201a59e13b3335aeeb7db721a
- name: order-processor
  newName: ghcr.io/igordems/cloudmart-order-processor
  newTag: latest
