apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudmart

resources:
- ../../base/namespace
- ../../base/ollama
- ../../base/agent-gateway
- ../../base/monitoring
- ../../base/localstack
- ../../base/cloudmart-backend
- ../../base/cloudmart-frontend

images:
- name: cloudmart-backend
  newName: ghcr.io/igordems/cloudmart-backend
  newTag: latest
- name: cloudmart-frontend
  newName: ghcr.io/igordems/cloudmart-frontend
  newTag: latest
- name: ghcr.io/igordems/agent-gateway
  newName: ghcr.io/igordems/agent-gateway
  newTag: cbc159639c664a36518d96ffbaf05ade6fe50e98
