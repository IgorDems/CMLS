apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/namespace
- ../../base/ollama
- ../../base/ai-stack
- ../../base/agent-gateway
- ../../base/monitoring
- ../../base/localstack
- ../../base/cloudmart-backend
- ../../base/cloudmart-frontend

images:
