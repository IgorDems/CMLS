apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-gateway
  namespace: cloudmart
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: agent-gateway.192.168.1.240.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agent-gateway
            port:
              number: 80 # Змінено на 8080, як у вашому бекенді
