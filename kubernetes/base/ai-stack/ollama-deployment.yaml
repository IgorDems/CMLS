apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: cloudmart # Розміщуємо в одному неймспейсі з WebUI для простоти
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_MODELS
          value: "/root/.ollama/models"
        volumeMounts:
        - name: host-models
          mountPath: /root/.ollama/models # Шлях всередині контейнера
      volumes:
      - name: host-models
        hostPath:
          path: /mnt/data/.ollama/models # ВАШ ШЛЯХ НА ДИСКУ AORUS
          type: Directory

