apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: cloudmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: OLLAMA_BASE_URL
          # Оновлено URL: звертаємось до Ollama в її неймспейсі
          value: "http://ollama.ollama.svc.cluster.local:11434"
        - name: DATA_DIR
          value: "/app/data" # Вказуємо шлях до даних всередині контейнера
        volumeMounts:
        - name: webui-data
          mountPath: /app/data # Прив'язуємо PVC до папки з даними
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc # Використовуємо створений вище PVC
