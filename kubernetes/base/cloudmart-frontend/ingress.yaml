apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudmart-frontend-ingress
  namespace: cloudmart
  annotations:
    kubernetes.io/ingress.class: nginx
    # Видаляємо rewrite-target для тесту, залишаємо лише необхідне
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
  - host: cloudmart.192.168.1.240.sslip.io
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific # Змінюємо для кращої сумісності з кореневим шляхом
        backend:
          service:
            name: cloudmart-frontend
            port:
              number: 3000
