apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudmart-backend-ingress
  namespace: cloudmart
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Додаємо CORS анотації, щоб браузер дозволяв фронтенду робити запити до API
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://cloudmart.192.168.1.240.sslip.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, OPTIONS"
spec:
  rules:
  - host: api.cloudmart.192.168.1.240.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudmart-backend-app-service
            port:
              number: 5000
