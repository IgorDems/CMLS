apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudmart-backend-ingress
  namespace: cloudmart
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Дозволяємо Nginx самому обробляти CORS запити
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://cloudmart.192.168.1.240.sslip.io, https://cloudmart.192.168.1.240.sslip.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  rules:
  - host: api.cloudmart.192.168.1.240.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudmart-backend
            port:
              number: 5000 # Переконайся, що тут вказано внутрішній порт сервісу бекенду (5000 або 3000), а не 80, якщо сервіс слухає інший порт!
