spec:
  containers:
  - name: ollama
    image: ollama/ollama:latest
    imagePullPolicy: Always
    ports:
    - containerPort: 11434
      protocol: TCP
    env:
    - name: OLLAMA_MODELS
      value: /root/.ollama/models
    - name: NVIDIA_VISIBLE_DEVICES       # <--- ДОДАТИ
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES   # <--- ДОДАТИ
      value: "compute,utility"
    resources:                          # <--- ЗАМІНИТИ resources: {} НА ЦЕ
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /root/.ollama
      name: host-ollama-root
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: aorus
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  terminationGracePeriodSeconds: 30
  volumes:
  - hostPath:
      path: /mnt/data/.ollama
      type: Directory
    name: host-ollama-root
