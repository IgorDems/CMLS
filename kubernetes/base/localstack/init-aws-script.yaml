apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init-script
  namespace: default
data:
  init-aws.sh: |
    #!/bin/bash
    echo "=== Initializing LocalStack Resources ==="

    # 1. Створення таблиці cloudmart_products (з ключами pk + sk)
    aws --endpoint-url=http://localhost:4566 dynamodb create-table \
      --table-name cloudmart_products \
      --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
      --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
      --billing-mode PAY_PER_REQUEST \
      --region us-east-1 || true

    # 2. Створення таблиці cloudmart_orders (з ключем id)
    aws --endpoint-url=http://localhost:4566 dynamodb create-table \
      --table-name cloudmart_orders \
      --attribute-definitions AttributeName=id,AttributeType=S \
      --key-schema AttributeName=id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST \
      --region us-east-1 || true

    # 3. Створення S3-бакетів
    aws --endpoint-url=http://localhost:4566 s3 mb s3://cloudmart-products --region us-east-1 || true
    aws --endpoint-url=http://localhost:4566 s3 mb s3://cloudmart-images --region us-east-1 || true
    aws --endpoint-url=http://localhost:4566 s3 mb s3://cloudmart-media --region us-east-1 || true

    echo "=== LocalStack Initialization Completed ==="
