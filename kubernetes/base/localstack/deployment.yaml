apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: PERSISTENCE
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          volumeMounts:
            # 1. Монтуємо ваш існуючий PVC для зберігання даних на диску
            - name: localstack-data
              mountPath: /var/lib/localstack
            # 2. Монтуємо ініціалізаційний скрипт у папку ready.d
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
      volumes:
        # 1. Ваш існуючий PVC
        - name: localstack-data
          persistentVolumeClaim:
            claimName: localstack-pvc
        # 2. ConfigMap зі скриптом (використовуємо існуючий або новий ConfigMap)
        - name: init-scripts
          configMap:
            name: localstack-init-script
            defaultMode: 0755
